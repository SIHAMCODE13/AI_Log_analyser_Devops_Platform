# =====================================================
# AI DevOps Log Analyzer — GitHub Actions CI/CD
# Runs tests → builds Docker images → pushes to DockerHub → deploys to K8s
# =====================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY:        docker.io
  IMAGE_PREFIX:    ${{ secrets.DOCKERHUB_USERNAME }}/loganalyzer

jobs:

  # ── Job 1: Test Backend ────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE:      loganalyzer_test
          MYSQL_USER:          testuser
          MYSQL_PASSWORD:      testpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        env:
          DATABASE_URL: mysql+aiomysql://testuser:testpass@localhost:3306/loganalyzer_test
          AI_SERVICE_URL: http://localhost:8001
          SECRET_KEY: test-secret-key
        run: pytest tests/ -v --tb=short

  # ── Job 2: Test AI Service ─────────────────────────────────────────────────
  test-ai-service:
    name: 🤖 Test AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Job 3: Lint & Security ─────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff bandit

      - name: Lint backend
        run: ruff check backend/app/ --ignore E501

      - name: Lint AI service
        run: ruff check ai-service/app/ --ignore E501

      - name: Security scan (bandit)
        run: |
          bandit -r backend/app/ -ll -q
          bandit -r ai-service/app/ -ll -q

  # ── Job 4: Build & Push Docker Images ─────────────────────────────────────
  build-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-ai-service, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v6
        with:
          context:    ./frontend
          push:       true
          tags:       ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.version }},${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & Push — Backend
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          push:       true
          tags:       ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.version }},${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & Push — AI Service
        uses: docker/build-push-action@v6
        with:
          context:    ./ai-service
          push:       true
          tags:       ${{ env.IMAGE_PREFIX }}-ai-service:${{ steps.meta.outputs.version }},${{ env.IMAGE_PREFIX }}-ai-service:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 5: Deploy to Kubernetes ────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          kubectl cluster-info

      - name: Update image tags in manifests
        run: |
          IMAGE_TAG=${{ needs.build-push.outputs.image-tag }}
          sed -i "s|:latest|:${IMAGE_TAG}|g" kubernetes/base/backend/deployment.yml
          sed -i "s|:latest|:${IMAGE_TAG}|g" kubernetes/base/frontend/deployment.yml
          sed -i "s|:latest|:${IMAGE_TAG}|g" kubernetes/base/ai-service/deployment.yml

      - name: Apply ConfigMaps & Secrets
        run: kubectl apply -f kubernetes/base/configmap-secrets.yml

      - name: Deploy Database
        run: kubectl apply -f kubernetes/base/database/

      - name: Deploy AI Service
        run: |
          kubectl apply -f kubernetes/base/ai-service/deployment.yml
          kubectl rollout status deployment/ai-service --timeout=120s

      - name: Deploy Backend
        run: |
          kubectl apply -f kubernetes/base/backend/deployment.yml
          kubectl rollout status deployment/backend --timeout=60s

      - name: Deploy Frontend
        run: |
          kubectl apply -f kubernetes/base/frontend/deployment.yml
          kubectl rollout status deployment/frontend --timeout=60s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods
          echo "=== Services ==="
          kubectl get services
          echo "=== Ingress ==="
          kubectl get ingress

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Rolling back..."
          kubectl rollout undo deployment/backend
          kubectl rollout undo deployment/frontend
          kubectl rollout undo deployment/ai-service
