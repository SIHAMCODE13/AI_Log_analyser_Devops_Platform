# =====================================================
# AI DevOps Log Analyzer — Docker Compose
# Full local development stack
# =====================================================

networks:
  lognet:
    driver: bridge

volumes:
  mysql_data:
  ai_models:
  prometheus_data:
  grafana_data:
  uploads_data:

services:

  # ── MySQL Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: loganalyzer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE:      loganalyzer
      MYSQL_USER:          loguser
      MYSQL_PASSWORD:      logpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3306:3306"
    networks: [lognet]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "loguser", "-plogpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── AI Microservice ────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: loganalyzer-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ai_models:/app/models
    networks: [lognet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    environment:
      - PYTHONUNBUFFERED=1

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loganalyzer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:     mysql+aiomysql://loguser:logpass@mysql:3306/loganalyzer
      AI_SERVICE_URL:   http://ai-service:8001
      DEBUG:            "false"
      SECRET_KEY:       "dev-secret-change-in-production"
      CORS_ORIGINS:     '["http://localhost","http://localhost:80","http://127.0.0.1","http://127.0.0.1:80","http://frontend","*"]'
      UPLOAD_DIR:       "/app/uploads"
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks: [lognet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - uploads_data:/app/uploads

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loganalyzer-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks: [lognet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: loganalyzer-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks: [lognet]

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: loganalyzer-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/loganalyzer.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [lognet]
