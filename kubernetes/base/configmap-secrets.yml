---
# ConfigMap — non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: loganalyzer-config
data:
  ai-service-url:     "http://ai-service:8001"
  cors-origins:       '["https://loganalyzer.yourdomain.com"]'
  max-file-size-mb:   "100"
  log-level:          "INFO"

---
# Secrets — sensitive values (base64 encoded)
# In production: use AWS Secrets Manager, GCP Secret Manager, or Vault
# Generate: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: loganalyzer-secrets
type: Opaque
data:
  # Replace these with real base64-encoded values
  # echo -n "mysql+aiomysql://loguser:logpass@mysql:3306/loganalyzer" | base64
  database-url: bXlzcWwrYWlvbXlzcWw6Ly9sb2d1c2VyOmxvZ3Bhc3NAbXlzcWw6MzMwNi9sb2dhbmFseXplcg==
  # echo -n "your-strong-secret-key-here" | base64
  secret-key:   eW91ci1zdHJvbmctc2VjcmV0LWtleS1oZXJl
  # echo -n "loguser" | base64
  db-username:  bG9ndXNlcg==
  # echo -n "logpass" | base64
  db-password:  bG9ncGFzcw==
