global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend-api
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics/

  - job_name: ai-service
    scrape_interval: 15s
    static_configs:
      - targets: ["ai-service:8001"]
    metrics_path: /metrics/
