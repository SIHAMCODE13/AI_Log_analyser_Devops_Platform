# =====================================================
# Prometheus Configuration
# =====================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    environment: local
    project:     loganalyzer

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend-api
    scrape_interval: 15s
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: ai-service
    scrape_interval: 15s
    static_configs:
      - targets: ["ai-service:8001"]
    metrics_path: /metrics

  - job_name: mysql
    scrape_interval: 30s
    static_configs:
      - targets: ["mysql:9104"]

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
